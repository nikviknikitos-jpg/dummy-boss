name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        run: |
          if [ ! -f "build.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR"
            fi
          fi
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-mod-jars
          path: "**/build/libs/*.jar"
